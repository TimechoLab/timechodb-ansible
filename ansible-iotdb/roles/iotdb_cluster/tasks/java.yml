---
- name: 校验版本号（模板按 2.x 配置布局编写）
  ansible.builtin.assert:
    that:
      - iotdb_version is match('^2\.')
    fail_msg: "iotdb_version={{ iotdb_version }} 不支持：本模板基于 2.x 的 iotdb-system.properties 布局；1.3/0.13 请另建模板"
    success_msg: "iotdb_version={{ iotdb_version }}"

- name: 读取 Java 版本
  ansible.builtin.command: java -version
  register: iotdb_java_check
  changed_when: false
  failed_when: false

- name: 解析 JAVA_HOME
  ansible.builtin.shell: dirname "$(dirname "$(readlink -f /usr/bin/java)")"
  register: iotdb_java_home_cmd
  changed_when: false
  when: iotdb_java_home is not defined or iotdb_java_home | length == 0

- name: 记录 JAVA_HOME
  ansible.builtin.set_fact:
    iotdb_java_home: "{{ iotdb_java_home_cmd.stdout }}"
  when: iotdb_java_home is not defined or iotdb_java_home | length == 0

- name: 校验 Java 版本（需 JDK 17+）
  ansible.builtin.assert:
    that:
      - iotdb_java_check.rc == 0
      - iotdb_java_check.stderr is search('version "(1[7-9]|2[0-9])')
    fail_msg: "Apache IoTDB {{ iotdb_version }} 需要 JDK 17+，当前: {{ iotdb_java_check.stderr | default('未安装 java') | trim }}"
    success_msg: "Java 版本满足要求（JDK 17+）"
